global:
  scrape_interval: 5s        # 15s en production ; 5s rend la démo plus réactive
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: healthcare
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - rest-service:8081
          - soap-service:8082
          - graphql-service:8083
          - telemetry-service:8084
          - orchestrator-service:8085
          - api-gateway:8099