groups:
  - name: healthcare
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} ne répond plus"

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        labels: { severity: warning }
        annotations:
          summary: "Circuit ouvert vers {{ $labels.name }}"

      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[1m]))
          / sum by (application) (rate(http_server_requests_seconds_count[1m])) > 0.1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Plus de 10 % d'erreurs 5xx sur {{ $labels.application }}"