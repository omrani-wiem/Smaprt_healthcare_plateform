server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: rest-service
              uri: lb://rest-service
              predicates:
                - Path=/rest/**
              filters:
                - StripPrefix=1

            - id: soap-service
              uri: lb://soap-service
              predicates:
                - Path=/soap/**
              filters:
                - RewritePath=/soap(?<segment>.*), /ws${segment}

            - id: graphql-service
              uri: lb://graphql-service
              predicates:
                - Path=/graphql

            - id: telemetry-service
              uri: lb://telemetry-service
              predicates:
                - Path=/telemetry/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus