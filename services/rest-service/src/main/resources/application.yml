server:
   port: 8080

spring:
    application:
        name: rest-service
    datasource:
        url: jdbc:postgresql://postgres:5432/rest_db
        username: admin
        password: admin

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

eureka:
    client:
        service-url:
        defaultZone: http://localhost:8761/eureka

management:
    endpoints:
        web:
            exposure:
                include : health,info,promotheus