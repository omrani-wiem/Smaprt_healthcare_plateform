x-common-env: &common-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16
    container_name: hc-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hc-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: hc-keycloak
    command: start-dev --import-realm
    volumes:
       - ./infra/keycloak/healthcare-realm.json:/opt/keycloak/data/import/healthcare-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Applications (profil "apps") ----------
  eureka:
    profiles: ["apps"]
    build: ./services/eureka-server
    ports:
      - "8761:8761"

  rest-service:
    profiles: ["apps"]
    build: ./services/restservice
    restart: on-failure
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rest_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka: { condition: service_started }

  soap-service:
    profiles: ["apps"]
    build: ./services/soap-service
    restart: on-failure
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/soap_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka: { condition: service_started }

  graphql-service:
    profiles: ["apps"]
    build: ./services/graphql-service
    restart: on-failure
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/graphql_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka: { condition: service_started }

  orchestrator-service:
    profiles: ["apps"]
    build: ./services/orchestrator-service
    restart: on-failure
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator_db
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      eureka: { condition: service_started }

  telemetry-service:
    profiles: ["apps"]
    build: ./services/telemetry-service
    restart: on-failure
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telemetry_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
    ports:
      - "9090:9090"      # gRPC : le capteur tourne sur ta machine
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      orchestrator-service: { condition: service_started }   # crée la file avant les publications
      eureka: { condition: service_started }

  api-gateway:
    profiles: ["apps"]
    build: ./services/api-gateway
    restart: on-failure
    environment:
      <<: *common-env
      # les clés publiques sont lues via le réseau Docker ; l'"issuer" reste celui du navigateur
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/healthcare/protocol/openid-connect/certs
    ports:
      - "8000:8000"
    depends_on:
      - eureka
      - keycloak

  client-web:
    profiles: ["apps"]
    build: ./client-web
    ports:
      - "5173:80"

    # ---------- Observabilité (profil "monitoring") ----------
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.1
    container_name: hc-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9091:9090"      # 9090 est déjà pris par le gRPC de la télémétrie

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.4.0
    container_name: hc-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata: